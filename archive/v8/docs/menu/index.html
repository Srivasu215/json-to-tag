<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Header Menu • @keshavsoft/json-to-tag</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light">

  <!-- Mount container for dynamically rendered menu.json -->
  <div id="header-mount"></div>

  <!-- Content to test responsive behavior and layout interaction -->
  <main class="container py-5 text-center text-secondary">
    <div class="p-5 bg-white border rounded-3 shadow-sm">
      <h1 class="display-6 fw-bold text-dark mb-3">Responsive Header Preview</h1>
      <p class="lead mb-4">
        Rendered dynamically from <code>menu.json</code> using <code>@keshavsoft/json-to-tag</code>.
      </p>
      <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
        <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-2">
          <i class="bi bi-display me-1"></i> Desktop: Full Nav &amp; Search
        </span>
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2">
          <i class="bi bi-phone me-1"></i> Mobile: Hamburger Collapse
        </span>
        <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-3 py-2">
          <i class="bi bi-file-earmark-code me-1"></i> 100% Pure Bootstrap 5.3
        </span>
      </div>
      <p class="small text-muted mb-0">
        Resize the browser window or toggle mobile view to test responsive collapse and desktop navigation.
      </p>
    </div>
  </main>

  <!-- Bootstrap 5.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>

  <!-- Dynamic Render Script -->
  <script type="module">
    import { buildSpecElement } from "../dist/min.js";

    async function renderHeader() {
      try {
        const response = await fetch("./menu.json?t=" + Date.now());
        const spec = await response.json();
        const headerElement = buildSpecElement({ inSpec: spec });
        const mount = document.getElementById("header-mount");
        mount.appendChild(headerElement);

        // Ensure Bootstrap 5 collapse works reliably on dynamic DOM elements
        const toggleBtn = headerElement.querySelector('[data-bs-toggle="collapse"]');
        const collapseTarget = headerElement.querySelector('#mobileNavCollapse');

        if (toggleBtn && collapseTarget) {
          toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (window.bootstrap?.Collapse) {
              const bsCollapse = window.bootstrap.Collapse.getOrCreateInstance(collapseTarget, { toggle: false });
              bsCollapse.toggle();
            } else {
              collapseTarget.classList.toggle('show');
            }
          });
        }
      } catch (err) {
        console.error("Failed to render menu.json:", err);
      }
    }

    renderHeader();
  </script>
</body>
</html>
